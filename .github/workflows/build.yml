name: Build Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish DeckServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out
      - name: Zip
        run: Compress-Archive -Path out\* -DestinationPath DeckServer-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DeckServer-win-x64
          path: DeckServer-win-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DeckServer-win-x64.zip
